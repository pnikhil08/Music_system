<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player">

        <h1>🎵 My Music Player</h1>

        <!-- Album Image -->
        <img 
            id="album-cover"
            src="https://picsum.photos/400/400?random=1"
            alt="Album Cover"
        >

        <!-- Song Information -->
        <h2 id="song-title">Song 1</h2>
        <p id="artist">Artist Name</p>

        <!-- Progress -->
        <div class="progress-container">
            <span id="current-time">0:00</span>

            <input 
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">

            <button id="previous">
                ⏮️
            </button>

            <button id="play">
                ▶️
            </button>

            <button id="next">
                ⏭️
            </button>

        </div>

        <!-- Volume -->
        <div class="volume">

            <span>🔊</span>

            <input 
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

        <!-- Song List -->
        <div class="playlist">

            <h3>Playlist</h3>

            <div class="song active" data-index="0">
                🎵 Song One
            </div>

            <div class="song" data-index="1">
                🎵 Song Two
            </div>

            <div class="song" data-index="2">
                🎵 Song Three
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
